<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>영수증 OCR</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Receipt OCR</p>
          <h1>영수증 등록</h1>
        </div>
        <button class="icon-button" id="retryButton" type="button" aria-label="대기 항목 재시도">
          <span id="queueCount">0</span>
        </button>
      </header>

      <section class="panel settings-panel" aria-label="연동 설정">
        <label class="field">
          <span>대시보드 API</span>
          <input id="apiBaseInput" type="url" inputmode="url" placeholder="https://dashboard.example.com/api" autocomplete="url" />
        </label>
        <button id="saveSettingsButton" class="secondary-button" type="button">저장</button>
      </section>

      <section class="capture-zone" aria-label="영수증 이미지">
        <input id="fileInput" class="file-input" type="file" accept="image/*" capture="environment" />
        <label class="capture-button" for="fileInput">
          <span class="camera-mark">+</span>
          <span>촬영</span>
        </label>
        <img id="previewImage" class="preview-image" alt="선택한 영수증" hidden />
      </section>

      <section class="action-row" aria-label="처리">
        <button id="ocrButton" class="primary-button" type="button" disabled>분석</button>
        <button id="uploadButton" class="primary-button accent" type="button" disabled>업로드</button>
      </section>

      <form id="receiptForm" class="panel form-grid" aria-label="영수증 내용">
        <label class="field">
          <span>가맹점</span>
          <input id="merchantInput" name="merchant" autocomplete="organization" />
        </label>
        <label class="field">
          <span>사용일</span>
          <input id="dateInput" name="purchasedAt" type="date" />
        </label>
        <label class="field">
          <span>총액</span>
          <input id="totalInput" name="totalAmount" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label class="field">
          <span>부가세</span>
          <input id="taxInput" name="taxAmount" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label class="field">
          <span>통화</span>
          <select id="currencyInput" name="currency">
            <option value="KRW">KRW</option>
            <option value="USD">USD</option>
            <option value="JPY">JPY</option>
            <option value="EUR">EUR</option>
          </select>
        </label>
        <label class="field">
          <span>분류</span>
          <select id="categoryInput" name="category">
            <option value="general">일반</option>
            <option value="meals">식비</option>
            <option value="transport">교통</option>
            <option value="supplies">비품</option>
            <option value="lodging">숙박</option>
          </select>
        </label>
        <label class="field full">
          <span>OCR 원문</span>
          <textarea id="rawTextInput" name="rawText" rows="5"></textarea>
        </label>
      </form>

      <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
