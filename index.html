<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3182f6" />
    <title>영수증 OCR</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">지출 결의 영수증</p>
          <h1>영수증을 촬영해 주세요</h1>
        </div>
        <button class="queue-button" id="retryButton" type="button" aria-label="대기 항목 재시도">
          <span id="queueCount">0</span>
        </button>
      </header>

      <section class="device-card" aria-label="기기 등록 상태">
        <div>
          <span>이 기기 ID</span>
          <strong id="deviceIdText">확인 중</strong>
        </div>
        <p>관리자가 이 ID를 직원에게 연결하면 누가 올렸는지 대시보드에서 확인할 수 있습니다.</p>
      </section>

      <section class="capture-zone" aria-label="영수증 이미지">
        <input id="cameraInput" class="file-input" type="file" accept="image/*" capture="environment" />
        <input id="albumInput" class="file-input" type="file" accept="image/*" multiple />
        <img id="previewImage" class="preview-image" alt="선택한 영수증" hidden />
        <div class="capture-actions">
          <label class="capture-button" for="cameraInput">
            <span class="capture-plus" aria-hidden="true">+</span>
            <span>촬영</span>
          </label>
          <label class="secondary-capture-button" for="albumInput">앨범 선택</label>
          <button id="rotateButton" class="secondary-capture-button" type="button" disabled>회전</button>
        </div>
        <p id="batchText" class="batch-text"></p>
      </section>

      <section class="action-row" aria-label="처리">
        <button id="ocrButton" class="primary-button" type="button" disabled>내용 분석</button>
        <button id="uploadButton" class="primary-button" type="button" disabled>업로드</button>
      </section>

      <section class="usage-panel" aria-label="지출 분류와 결제 방식">
        <label class="field">
          <span>지출 소분류 <strong>필수</strong></span>
          <select id="categoryInput" name="category" required></select>
        </label>
        <div class="usage-major" id="usageMajorText">대분류 자동 계산</div>
        <div class="payment-grid">
          <label class="field">
            <span>결제 방식</span>
            <select id="paymentMethodInput" name="paymentMethod">
              <option value="corporate_card">법인 카드</option>
              <option value="personal_card">개인 카드</option>
              <option value="corporate_transfer">법인 계좌이체</option>
              <option value="transfer_request">이체 요청</option>
            </select>
          </label>
          <label class="field">
            <span>카드 뒷자리</span>
            <input id="cardLast4Input" name="cardLast4" inputmode="numeric" maxlength="4" placeholder="자동 인식" />
          </label>
        </div>
        <p id="paymentNotice" class="payment-notice" hidden></p>
        <label class="field">
          <span>메모</span>
          <textarea id="usageInput" name="usageContent" rows="3" placeholder="예: 거래처 미팅 다과 구입"></textarea>
        </label>
      </section>

      <form id="receiptForm" class="result-panel" aria-label="영수증 자동 인식 결과">
        <div class="section-heading">
          <div>
            <p class="eyebrow">자동 인식 결과</p>
            <h2>영수증 내용</h2>
          </div>
          <p>분석 후 자동으로 채워지며, 틀린 값만 수정하시면 됩니다.</p>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>가맹점</span>
            <input id="merchantInput" name="merchant" autocomplete="organization" placeholder="자동 인식" />
          </label>
          <label class="field full date-field">
            <span>사용일</span>
            <input id="dateInput" name="purchasedAt" type="date" />
          </label>
          <label class="field">
            <span>총액</span>
            <input id="totalInput" name="totalAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="자동 인식" />
          </label>
          <label class="field">
            <span>부가세</span>
            <input id="taxInput" name="taxAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="자동 인식" />
          </label>
          <label class="field">
            <span>통화</span>
            <select id="currencyInput" name="currency">
              <option value="KRW">KRW</option>
              <option value="USD">USD</option>
              <option value="JPY">JPY</option>
              <option value="EUR">EUR</option>
            </select>
          </label>
          <label class="field full">
            <span>OCR 원문</span>
            <textarea id="rawTextInput" name="rawText" rows="4" placeholder="분석 결과 원문이 표시됩니다."></textarea>
          </label>
        </div>
      </form>

      <p class="confirmation-text">위 내용이 맞다면 업로드 버튼을 눌러주세요.</p>
      <p id="statusText" class="status-text" role="status" aria-live="polite"></p>

      <div id="feedbackDialog" class="feedback-dialog" role="alertdialog" aria-live="assertive" aria-modal="true" hidden>
        <div class="feedback-dialog__panel">
          <div id="feedbackIcon" class="feedback-dialog__icon" aria-hidden="true"></div>
          <h2 id="feedbackTitle"></h2>
          <p id="feedbackMessage"></p>
          <button id="feedbackCloseButton" class="primary-button" type="button">확인</button>
        </div>
      </div>

    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
